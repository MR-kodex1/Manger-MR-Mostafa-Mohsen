<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول المدرس | منصة القيصر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <style>
        body { background: #0a0a0a; color: white; font-family: 'Cairo', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #111; padding: 40px; border-radius: 15px; border: 1px solid #D4AF37; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 0 30px rgba(212, 175, 55, 0.2); }
        .login-box h2 { color: #D4AF37; margin-bottom: 10px; }
        .login-box p { color: #888; margin-bottom: 30px; font-size: 14px; }
        .input-group { text-align: right; margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: #ccc; font-size: 14px; }
        .input-group input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; border-radius: 8px; color: white; outline: none; box-sizing: border-box; }
        .input-group input:focus { border-color: #D4AF37; }
        .btn { width: 100%; padding: 12px; background: #D4AF37; color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #F5E08C; }
        .error { color: #ff6b6b; margin-top: 15px; font-size: 14px; display: none; }
    </style>
</head>
<body>

    <div class="login-box">
        <i class="fa-solid fa-crown" style="font-size: 40px; color: #D4AF37; margin-bottom: 15px;"></i>
        <h2>لوحة تحكم المدرس</h2>
        <p>هذه الصفحة مخصصة لإدارة المنصة فقط</p>

        <div class="input-group">
            <label>البريد الإلكتروني</label>
            <input type="email" id="username" placeholder="admin@qaysar.com">
        </div>
        <div class="input-group">
            <label>كلمة المرور</label>
            <input type="password" id="password" placeholder="********">
        </div>

        <button class="btn" onclick="login()">تسجيل الدخول</button>
        <p id="error" class="error">بيانات الدخول غير صحيحة!</p>
    </div>

    <script>
        function login() {
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value;

            // بيانات الدخول (تقدر تغيرها)
            const adminEmail = "MR-Mostafa-Mohsen@MM-2027-1000";
            const adminPass = "01019113388";

            if (user === adminEmail && pass === adminPass) {
                localStorage.setItem("is_admin", "true");
                window.location.href = "dashboard.html";
            } else {
                document.getElementById("error").style.display = "block";
            }
        }
        if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js');
}
    </script>
</body>
</html>
